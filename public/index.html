<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Hidden from search until launch (see LAUNCH.md). -->
<meta name="robots" content="noindex, nofollow">
<title>Your Name</title>
<meta name="description" content="One sentence about who you are and what this site is for.">
<meta property="og:title" content="Your Name">
<meta property="og:description" content="One sentence about who you are and what this site is for.">
<meta property="og:image" content="/og.jpg?v=1">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{--bg:#faf7f2;--ink:#1f1b16;--sub:#6b6157;--accent:#b5542a;--line:#e7dfd4}
@media (prefers-color-scheme:dark){:root{--bg:#16130f;--ink:#f2ece4;--sub:#a99d90;--accent:#e08a5c;--line:#2c2620}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.65 Georgia,"Times New Roman",serif}
main{max-width:680px;margin:0 auto;padding:72px 20px 96px}
.kicker{font:600 13px/1 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font-size:clamp(36px,7vw,56px);line-height:1.05;margin:14px 0 18px;letter-spacing:-.02em}
p{margin:0 0 18px;color:var(--sub)}
.box{border:1px dashed var(--line);border-radius:12px;padding:20px 22px;margin-top:36px;font:16px/1.6 system-ui,sans-serif}
.box strong{color:var(--ink)}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <div class="kicker">Coming soon</div>
  <h1>Your name here</h1>
  <p>This is your website. It's yours: your GitHub, your Cloudflare, your words.</p>
  <div class="box">
    <strong>Next step:</strong> open Claude, pick this repository, and paste in the prompt from <code>FIRST-PROMPT.md</code>. Claude will ask you a few questions and build your first page from a site you like.
  </div>
</main>
</body>
</html>
